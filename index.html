<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta property="og:title" content="Bubble Pop! - バブルポップゲーム">
<meta property="og:description" content="泡をタップして生き延びろ！制限時間サバイバル🫧">
<meta property="og:type" content="website">
<title>Bubble Pop! 🫧</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    touch-action: none;
  }

  h1 {
    color: #fff;
    font-size: clamp(2rem, 6vw, 3.5rem);
    text-align: center;
    text-shadow: 0 0 30px rgba(150, 100, 255, 0.8);
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .subtitle {
    color: rgba(255,255,255,0.6);
    font-size: clamp(0.85rem, 2.5vw, 1.1rem);
    text-align: center;
    margin-bottom: 16px;
  }

  #game-area {
    position: relative;
    width: min(480px, 96vw);
    height: min(560px, 62vh);
    background: rgba(255,255,255,0.04);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.12);
    overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    cursor: crosshair;
  }

  #game-area::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(120,80,255,0.15) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ── HUD ── */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: min(480px, 96vw);
    padding: 10px 4px 6px;
    gap: 8px;
  }

  .stat-box {
    text-align: center;
    flex: 1;
  }

  .stat-box.primary {
    flex: 2;
  }

  .stat-label {
    color: rgba(255,255,255,0.5);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .stat-value {
    color: #fff;
    font-size: clamp(1.3rem, 3.5vw, 1.8rem);
    font-weight: 700;
    line-height: 1.1;
  }

  .stat-box.primary .stat-value {
    font-size: clamp(2rem, 6vw, 3rem);
    color: #a855f7;
    text-shadow: 0 0 20px rgba(168,85,247,0.7);
  }

  #timer-bar-wrap {
    width: min(480px, 96vw);
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  #timer-bar {
    height: 100%;
    width: 60%;
    background: linear-gradient(90deg, #a855f7, #06b6d4);
    border-radius: 4px;
    transition: width 0.1s linear, background 0.5s;
  }

  #timer-bar.danger {
    background: linear-gradient(90deg, #ef4444, #f97316);
    animation: pulse-bar 0.4s ease-in-out infinite alternate;
  }

  @keyframes pulse-bar {
    from { opacity: 1; }
    to   { opacity: 0.4; }
  }

  /* ── Bubbles ── */
  .bubble {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    animation: float-up linear forwards;
    will-change: transform, opacity;
    user-select: none;
    -webkit-user-select: none;
  }

  .bubble::after {
    content: '';
    position: absolute;
    top: 15%; left: 20%;
    width: 30%; height: 25%;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    transform: rotate(-30deg);
  }

  @keyframes float-up {
    0%   { transform: translateY(0) scale(1); opacity: 0.9; }
    80%  { opacity: 0.9; }
    100% { transform: translateY(-640px) scale(0.7); opacity: 0; }
  }

  .bubble.popped {
    animation: pop 0.25s ease-out forwards !important;
    pointer-events: none;
  }

  @keyframes pop {
    0%   { transform: scale(1); opacity: 1; }
    50%  { transform: scale(1.6); opacity: 0.8; }
    100% { transform: scale(0); opacity: 0; }
  }

  /* ── Score popup ── */
  .score-popup {
    position: absolute;
    font-weight: 900;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
    transform-origin: center bottom;
  }

  /* Normal score: bounce up */
  .score-popup.normal {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    animation: score-normal 0.9s cubic-bezier(0.22,1,0.36,1) forwards;
    text-shadow: 0 0 16px currentColor, 0 2px 8px rgba(0,0,0,0.5);
  }

  @keyframes score-normal {
    0%   { transform: translate(-50%, 0) scale(0.4); opacity: 1; }
    25%  { transform: translate(-50%, -24px) scale(1.3); opacity: 1; }
    60%  { transform: translate(-50%, -50px) scale(1.0); opacity: 1; }
    100% { transform: translate(-50%, -80px) scale(0.7); opacity: 0; }
  }

  /* Star score: mega flashy */
  .score-popup.star {
    font-size: clamp(2.4rem, 7vw, 3.2rem);
    animation: score-star 1.1s cubic-bezier(0.22,1,0.36,1) forwards;
    text-shadow:
      0 0 8px #fff,
      0 0 24px currentColor,
      0 0 48px currentColor,
      0 2px 10px rgba(0,0,0,0.6);
    filter: drop-shadow(0 0 12px currentColor);
  }

  @keyframes score-star {
    0%   { transform: translate(-50%, 0) scale(0.2) rotate(-15deg); opacity: 1; }
    20%  { transform: translate(-50%, -30px) scale(2.0) rotate(8deg); opacity: 1; }
    45%  { transform: translate(-50%, -55px) scale(1.5) rotate(-4deg); opacity: 1; }
    100% { transform: translate(-50%, -110px) scale(0.8) rotate(0deg); opacity: 0; }
  }

  /* Time gain sub-label */
  .time-popup {
    position: absolute;
    font-size: 0.95rem;
    font-weight: 700;
    color: #06b6d4;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
    animation: time-float 0.8s ease-out forwards;
    text-shadow: 0 0 10px #06b6d4;
  }

  @keyframes time-float {
    0%   { transform: translate(-50%, 0); opacity: 1; }
    100% { transform: translate(-50%, -40px); opacity: 0; }
  }

  /* ── Overlay screens ── */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(10, 8, 30, 0.85);
    backdrop-filter: blur(6px);
    border-radius: 24px;
    z-index: 20;
    padding: 24px;
  }

  .overlay h2 {
    color: #fff;
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    text-align: center;
    text-shadow: 0 0 24px rgba(168, 85, 247, 0.9);
  }

  .overlay .big-score {
    font-size: clamp(3rem, 10vw, 5rem);
    font-weight: 900;
    color: #a855f7;
    text-shadow: 0 0 40px rgba(168, 85, 247, 0.8);
    line-height: 1;
  }

  .overlay .result-label {
    color: rgba(255,255,255,0.6);
    font-size: 1rem;
    text-align: center;
    margin-top: -8px;
  }

  .overlay .result-row {
    display: flex;
    gap: 28px;
    color: rgba(255,255,255,0.7);
    font-size: 0.95rem;
  }

  .overlay .result-row span strong {
    color: #fff;
    font-size: 1.15rem;
  }

  .overlay p {
    color: rgba(255,255,255,0.65);
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    text-align: center;
    line-height: 1.6;
  }

  .btn {
    padding: 14px 36px;
    border: none;
    border-radius: 50px;
    font-size: clamp(1rem, 3vw, 1.2rem);
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.03em;
  }

  .btn:hover  { transform: translateY(-2px); }
  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: linear-gradient(135deg, #a855f7, #6366f1);
    color: #fff;
    box-shadow: 0 4px 20px rgba(168, 85, 247, 0.5);
  }

  .btn-x {
    background: #000;
    color: #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 28px;
  }

  .btn-x svg { flex-shrink: 0; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

  /* ── Particles ── */
  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: particle-burst 0.6s ease-out forwards;
  }

  @keyframes particle-burst {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* Star particles are bigger */
  .particle.star {
    animation-duration: 0.8s;
  }

  /* ── Ripple ── */
  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.6);
    animation: ripple-out 0.4s ease-out forwards;
    pointer-events: none;
  }

  @keyframes ripple-out {
    from { transform: scale(1); opacity: 0.7; }
    to   { transform: scale(2.5); opacity: 0; }
  }

  /* ── Timer bar gain flash ── */
  #timer-bar.gain-flash { filter: brightness(1.7); }
</style>
</head>
<body>

<h1>Bubble Pop! 🫧</h1>
<p class="subtitle">泡をタップして生き延びろ！</p>

<div class="hud">
  <div class="stat-box primary">
    <div class="stat-label">スコア</div>
    <div class="stat-value" id="score-display">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">残り時間</div>
    <div class="stat-value" id="time-display">3.0s</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">生存時間</div>
    <div class="stat-value" id="survival-display">0.0s</div>
  </div>
</div>

<div id="timer-bar-wrap">
  <div id="timer-bar"></div>
</div>

<div id="game-area">
  <!-- Start Screen -->
  <div class="overlay" id="screen-start">
    <h2>Bubble Pop! 🫧</h2>
    <p>泡をタップして制限時間をゲット！<br>
       制限時間は最大5秒。スコアが上がるほど泡が速くなる！<br>
       ⭐ 星の泡はスコア2倍！</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-start">ゲームスタート</button>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div class="overlay" id="screen-gameover" style="display:none">
    <h2>ゲームオーバー！</h2>
    <div class="big-score" id="final-score">0</div>
    <div class="result-label">スコア</div>
    <div class="result-row">
      <span>生存 <strong id="final-survival">0.0s</strong></span>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-retry">もう一度</button>
      <button class="btn btn-x" id="btn-share">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        Xでシェア
      </button>
    </div>
  </div>
</div>

<script>
// ─── Config ───────────────────────────────────────────────
const MAX_TIME   = 5.0;
const INIT_TIME  = 3.0;
const SIZE_MIN   = 40;
const SIZE_MAX   = 70;

const BUBBLE_COLORS = [
  { bg: 'rgba(168,85,247,0.75)',  glow: '#a855f7' },
  { bg: 'rgba(99,102,241,0.75)', glow: '#6366f1' },
  { bg: 'rgba(6,182,212,0.75)',  glow: '#06b6d4' },
  { bg: 'rgba(236,72,153,0.75)', glow: '#ec4899' },
  { bg: 'rgba(245,158,11,0.75)', glow: '#f59e0b' },
  { bg: 'rgba(16,185,129,0.75)', glow: '#10b981' },
  { bg: 'rgba(239,68,68,0.75)',  glow: '#ef4444' },
];
const SPECIAL_CHANCE = 0.12;

// Score proportional to size (large=low score, small=high score for time, but score is just size-based)
// size 40→60pts, size 70→105pts (larger = more score)
function scoreForSize(size) {
  return Math.round(size * 1.5);
}

// Time gain: size 40→2.0s, size 70→1.0s (smaller = more time)
function timeGainForSize(size) {
  const t = Math.min(1, Math.max(0, (size - SIZE_MIN) / (SIZE_MAX - SIZE_MIN)));
  return parseFloat((2 - t).toFixed(2));
}

// Bubble rise duration shortens as score grows
function bubbleDuration(score) {
  return Math.max(0.8, 2.8 - score * 0.005);
}

// ─── State ────────────────────────────────────────────────
let score        = 0;
let timeLeft     = INIT_TIME;
let survivalTime = 0;
let gameRunning  = false;
let spawnTimer   = null;
let tickTimer    = null;

// ─── DOM ──────────────────────────────────────────────────
const area          = document.getElementById('game-area');
const scoreEl       = document.getElementById('score-display');
const timeEl        = document.getElementById('time-display');
const survivalEl    = document.getElementById('survival-display');
const timerBar      = document.getElementById('timer-bar');
const screenStart   = document.getElementById('screen-start');
const screenOver    = document.getElementById('screen-gameover');
const finalScoreEl  = document.getElementById('final-score');
const finalSurvival = document.getElementById('final-survival');

// ─── Start / Restart ──────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-retry').addEventListener('click', startGame);
document.getElementById('btn-share').addEventListener('click', shareOnX);

function startGame() {
  score        = 0;
  timeLeft     = INIT_TIME;
  survivalTime = 0;
  gameRunning  = true;

  updateHUD();
  timerBar.classList.remove('danger');

  screenStart.style.display = 'none';
  screenOver.style.display  = 'none';

  area.querySelectorAll('.bubble, .score-popup, .time-popup, .particle, .ripple').forEach(el => el.remove());

  clearTimeout(spawnTimer);
  clearInterval(tickTimer);

  spawnBubble();
  scheduleNextBubble();

  tickTimer = setInterval(() => {
    timeLeft     = Math.max(0, timeLeft - 0.1);
    survivalTime += 0.1;
    updateHUD();
    if (timeLeft <= 0) endGame();
  }, 100);
}

// ─── Spawn loop ───────────────────────────────────────────
function scheduleNextBubble() {
  if (!gameRunning) return;
  const interval = getSpawnInterval(survivalTime);
  spawnTimer = setTimeout(() => {
    if (!gameRunning) return;
    spawnBubble();
    scheduleNextBubble();
  }, interval);
}

function getSpawnInterval(elapsed) {
  return Math.max(250, 900 - elapsed * 20);
}

// ─── Spawn Bubble ─────────────────────────────────────────
function spawnBubble() {
  if (!gameRunning) return;

  const isSpecial = Math.random() < SPECIAL_CHANCE;
  const color = BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];
  const size  = isSpecial
    ? 52 + Math.random() * 16
    : SIZE_MIN + Math.random() * (SIZE_MAX - SIZE_MIN);

  // Speed based on current score
  const base     = bubbleDuration(score);
  const duration = base + Math.random() * 0.5;

  const areaW = area.clientWidth;
  const x = size / 2 + Math.random() * (areaW - size);
  const y = area.clientHeight - size / 2;

  const b = document.createElement('div');
  b.className = 'bubble';
  b.style.cssText = `
    width:${size}px; height:${size}px;
    left:${x - size/2}px; top:${y - size/2}px;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.25), ${color.bg});
    box-shadow: 0 0 ${isSpecial ? 24 : 12}px ${color.glow}, inset 0 0 8px rgba(255,255,255,0.15);
    animation-duration: ${duration}s;
    font-size: ${size * 0.42}px;
  `;
  b.textContent    = isSpecial ? '⭐' : '';
  b.dataset.glow   = color.glow;
  b.dataset.size   = size;
  b.dataset.special = isSpecial ? '1' : '0';

  b.addEventListener('pointerdown', onBubblePop, { passive: true });
  area.appendChild(b);

  b.addEventListener('animationend', () => {
    if (!b.classList.contains('popped')) b.remove();
  });
}

// ─── Pop ──────────────────────────────────────────────────
function onBubblePop(e) {
  if (!gameRunning) return;
  const b = e.currentTarget;
  if (b.classList.contains('popped')) return;
  b.classList.add('popped');

  const isSpecial = b.dataset.special === '1';
  const sz        = parseFloat(b.dataset.size);
  const glow      = b.dataset.glow;

  // Score (star = 2x)
  const pts = scoreForSize(sz) * (isSpecial ? 2 : 1);
  score += pts;

  // Time gain (capped at MAX_TIME)
  const gain = timeGainForSize(sz);
  timeLeft = Math.min(MAX_TIME, timeLeft + gain);

  updateHUD();

  // Flash timer bar
  timerBar.classList.add('gain-flash');
  setTimeout(() => timerBar.classList.remove('gain-flash'), 150);

  // Effect origin = pointer position
  const areaRect = area.getBoundingClientRect();
  const px = e.clientX - areaRect.left;
  const py = e.clientY - areaRect.top;

  // Score popup (primary, big)
  showScorePopup(px, py, '+' + pts, glow, isSpecial);

  // Time popup (secondary, small, slightly offset)
  showTimePopup(px, py + 32, '+' + gain + 's');

  // Particles
  spawnParticles(px, py, glow, isSpecial);

  // Ripple
  const rip = document.createElement('div');
  rip.className = 'ripple';
  rip.style.cssText = `width:${sz}px;height:${sz}px;left:${px - sz/2}px;top:${py - sz/2}px;border-color:${glow};`;
  area.appendChild(rip);
  rip.addEventListener('animationend', () => rip.remove());

  b.addEventListener('animationend', () => b.remove(), { once: true });
}

// ─── HUD ──────────────────────────────────────────────────
function updateHUD() {
  scoreEl.textContent    = score;
  timeEl.textContent     = timeLeft.toFixed(1) + 's';
  survivalEl.textContent = survivalTime.toFixed(1) + 's';

  const pct = timeLeft / MAX_TIME;
  timerBar.style.width = (pct * 100) + '%';
  if (pct < 0.3) timerBar.classList.add('danger');
  else           timerBar.classList.remove('danger');
}

// ─── Effect helpers ───────────────────────────────────────
function showScorePopup(x, y, text, color, isStar) {
  const el = document.createElement('div');
  el.className = 'score-popup ' + (isStar ? 'star' : 'normal');
  el.textContent = text;
  el.style.cssText = `left:${x}px; top:${y - 10}px; color:${color};`;
  area.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function showTimePopup(x, y, text) {
  const el = document.createElement('div');
  el.className = 'time-popup';
  el.textContent = text;
  el.style.cssText = `left:${x}px; top:${y}px;`;
  area.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function spawnParticles(x, y, color, isStar) {
  const count = isStar ? 16 : 8;
  const size  = isStar ? '12px' : '8px';
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle' + (isStar ? ' star' : '');
    const angle = (i / count) * Math.PI * 2;
    const dist  = isStar ? 50 + Math.random() * 50 : 30 + Math.random() * 30;
    p.style.cssText = `
      left:${x}px; top:${y}px;
      width:${size}; height:${size};
      background:${isStar ? (i % 2 === 0 ? '#ffd700' : color) : color};
      --dx:${Math.cos(angle) * dist}px;
      --dy:${Math.sin(angle) * dist}px;
    `;
    area.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}

// ─── End Game ─────────────────────────────────────────────
function endGame() {
  if (!gameRunning) return;
  gameRunning = false;
  clearTimeout(spawnTimer);
  clearInterval(tickTimer);

  timerBar.style.width = '0%';
  timerBar.classList.remove('danger');

  finalScoreEl.textContent  = score;
  finalSurvival.textContent = survivalTime.toFixed(1) + 's';
  screenOver.style.display  = 'flex';
}

// ─── X Share ──────────────────────────────────────────────
function shareOnX() {
  const text = `🫧 Bubble Pop! でスコア ${score} 点！${survivalTime.toFixed(1)}秒生き残った！\n泡をタップして制限時間をゲットするサバイバルゲーム！\nあなたも挑戦してみて👇`;
  const url   = encodeURIComponent(location.href);
  const tweet = encodeURIComponent(text);
  window.open(`https://x.com/intent/tweet?text=${tweet}&url=${url}`, '_blank', 'noopener');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta property="og:title" content="Bubble Pop! - バブルポップゲーム">
<meta property="og:description" content="泡をタップして生き延びろ！制限時間サバイバル🫧">
<meta property="og:type" content="website">
<title>Bubble Pop! 🫧</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden; touch-action: none;
  }
  h1 {
    color: #fff; font-size: clamp(2rem,6vw,3.5rem); text-align: center;
    text-shadow: 0 0 30px rgba(150,100,255,0.8); letter-spacing: .05em; margin-bottom: 8px;
  }
  .subtitle {
    color: rgba(255,255,255,0.6); font-size: clamp(.85rem,2.5vw,1.1rem);
    text-align: center; margin-bottom: 16px;
  }
  #game-area {
    position: relative; width: min(480px,96vw,calc(62dvh * 6 / 7)); aspect-ratio: 6/7;
    background: rgba(255,255,255,.04); border-radius: 24px;
    border: 1px solid rgba(255,255,255,.12); overflow: hidden;
    box-shadow: 0 8px 48px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);
    cursor: crosshair;
  }
  #game-area::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(120,80,255,.15) 0%, transparent 60%);
    pointer-events: none;
  }
  .hud {
    display: flex; justify-content: space-between; align-items: center;
    width: min(480px,96vw,calc(62dvh * 6 / 7)); padding: 10px 4px 6px; gap: 8px;
  }
  .stat-box { text-align: center; flex: 1; }
  .stat-box.primary { flex: 2; }
  .stat-label { color: rgba(255,255,255,.5); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; }
  .stat-value { color: #fff; font-size: clamp(1.3rem,3.5vw,1.8rem); font-weight: 700; line-height: 1.1; }
  .stat-box.primary .stat-value {
    font-size: clamp(2rem,6vw,3rem); color: #a855f7;
    text-shadow: 0 0 20px rgba(168,85,247,.7);
  }
  /* ── Water background ── */
  #water {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 100%;
    z-index: 0;
    border-radius: 0 0 24px 24px;
    background: linear-gradient(to top,
      rgba(6,130,200,.6) 0%,
      rgba(14,165,233,.4) 60%,
      rgba(56,189,248,.2) 100%);
    transition: height .15s ease-out;
  }
  #water.danger {
    background: linear-gradient(to top,
      rgba(185,28,28,.65) 0%,
      rgba(220,38,38,.45) 60%,
      rgba(239,68,68,.2) 100%);
  }
  /* Scrolling SVG wave line at the water surface */
  #water::before {
    content: '';
    position: absolute;
    top: -10px; left: 0;
    width: 100%; height: 20px;
    background-repeat: repeat-x;
    background-size: 160px 20px;
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='20'><path d='M0,10 Q40,1 80,10 Q120,19 160,10' stroke='%230369A1' stroke-width='2.5' stroke-opacity='0.7' fill='none'/></svg>");
    animation: wave-scroll 2.5s linear infinite;
  }
  #water.danger::before {
    background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='20'><path d='M0,10 Q40,1 80,10 Q120,19 160,10' stroke='%23991B1B' stroke-width='2.5' stroke-opacity='0.7' fill='none'/></svg>");
  }
  @keyframes wave-scroll {
    from { background-position-x: 0; }
    to   { background-position-x: 160px; }
  }
  /* Ensure bubbles and effects render above water */
  .bubble { z-index: 1; }

  /* Bubbles */
  .bubble {
    position: absolute; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: rgba(255,255,255,.9);
    text-shadow: 0 1px 3px rgba(0,0,0,.4);
    animation: float-up linear forwards;
    will-change: transform, opacity; user-select: none; -webkit-user-select: none;
  }
  .bubble::after {
    content: ''; position: absolute; top:15%; left:20%;
    width:30%; height:25%; background: rgba(255,255,255,.18);
    border-radius: 50%; transform: rotate(-30deg);
  }
  @keyframes float-up {
    0%   { transform: translateY(0) scale(1); opacity: .9; }
    80%  { opacity: .9; }
    100% { transform: translateY(-640px) scale(.7); opacity: 0; }
  }
  .bubble.popped {
    animation: pop .25s ease-out forwards !important;
    pointer-events: none;
  }
  @keyframes pop {
    0%   { transform: scale(1);   opacity: 1; }
    50%  { transform: scale(1.6); opacity: .8; }
    100% { transform: scale(0);   opacity: 0; }
  }

  /* Score popup */
  .score-popup {
    position: absolute; font-weight: 900; pointer-events: none;
    z-index: 10; white-space: nowrap; transform-origin: center bottom;
  }
  .score-popup.normal {
    font-size: clamp(1.6rem,5vw,2.2rem);
    animation: score-normal .9s cubic-bezier(.22,1,.36,1) forwards;
    text-shadow: 0 0 16px currentColor, 0 2px 8px rgba(0,0,0,.5);
  }
  @keyframes score-normal {
    0%   { transform: translate(-50%,0) scale(.4); opacity:1; }
    25%  { transform: translate(-50%,-24px) scale(1.3); opacity:1; }
    60%  { transform: translate(-50%,-50px) scale(1); opacity:1; }
    100% { transform: translate(-50%,-80px) scale(.7); opacity:0; }
  }
  .score-popup.star {
    font-size: clamp(2.4rem,7vw,3.2rem);
    animation: score-star 1.1s cubic-bezier(.22,1,.36,1) forwards;
    text-shadow: 0 0 8px #fff, 0 0 24px currentColor, 0 0 48px currentColor;
    filter: drop-shadow(0 0 12px currentColor);
  }
  @keyframes score-star {
    0%   { transform: translate(-50%,0) scale(.2) rotate(-15deg); opacity:1; }
    20%  { transform: translate(-50%,-30px) scale(2) rotate(8deg); opacity:1; }
    45%  { transform: translate(-50%,-55px) scale(1.5) rotate(-4deg); opacity:1; }
    100% { transform: translate(-50%,-110px) scale(.8) rotate(0deg); opacity:0; }
  }
  .time-popup {
    position: absolute; font-size: .95rem; font-weight: 700; color: #06b6d4;
    pointer-events: none; z-index: 10; white-space: nowrap;
    animation: time-float .8s ease-out forwards; text-shadow: 0 0 10px #06b6d4;
  }
  @keyframes time-float {
    0%   { transform: translate(-50%,0); opacity:1; }
    100% { transform: translate(-50%,-40px); opacity:0; }
  }

  /* Combo milestone */
  .combo-milestone {
    position: absolute; left: 50%; top: 30%;
    transform: translateX(-50%);
    font-size: clamp(1.4rem,4.5vw,2rem); font-weight: 900; color: #ffd700;
    text-shadow: 0 0 20px #ffd700, 0 0 40px rgba(255,215,0,.5);
    pointer-events: none; z-index: 15; white-space: nowrap;
    animation: milestone-pop .9s cubic-bezier(.22,1,.36,1) forwards;
  }
  @keyframes milestone-pop {
    0%   { transform: translateX(-50%) scale(.3); opacity:1; }
    30%  { transform: translateX(-50%) scale(1.2); opacity:1; }
    70%  { transform: translateX(-50%) scale(1); opacity:1; }
    100% { transform: translateX(-50%) scale(.8) translateY(-30px); opacity:0; }
  }

  /* Overlay */
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: rgba(10,8,30,.85); backdrop-filter: blur(6px);
    border-radius: 24px; z-index: 20; padding: 24px;
  }
  .overlay h2 {
    color: #fff; font-size: clamp(1.8rem,6vw,2.8rem); text-align: center;
    text-shadow: 0 0 24px rgba(168,85,247,.9);
  }
  .overlay .big-score {
    font-size: clamp(3rem,10vw,5rem); font-weight: 900; color: #a855f7;
    text-shadow: 0 0 40px rgba(168,85,247,.8); line-height: 1;
  }
  .overlay .result-label { color: rgba(255,255,255,.6); font-size:1rem; text-align:center; margin-top:-8px; }
  .overlay .result-row { display:flex; gap:28px; color:rgba(255,255,255,.7); font-size:.95rem; }
  .overlay .result-row span strong { color:#fff; font-size:1.15rem; }
  .overlay p { color:rgba(255,255,255,.65); font-size:clamp(.85rem,2.5vw,1rem); text-align:center; line-height:1.6; }
  .btn {
    padding:14px 36px; border:none; border-radius:50px;
    font-size:clamp(1rem,3vw,1.2rem); font-weight:700; cursor:pointer;
    transition:transform .15s,box-shadow .15s; letter-spacing:.03em;
  }
  .btn:hover  { transform:translateY(-2px); }
  .btn:active { transform:scale(.96); }
  .btn-primary { background:linear-gradient(135deg,#a855f7,#6366f1); color:#fff; box-shadow:0 4px 20px rgba(168,85,247,.5); }
  .btn-x { background:#000; color:#fff; box-shadow:0 4px 16px rgba(0,0,0,.4); display:flex; align-items:center; gap:10px; padding:12px 28px; }
  .btn-x svg { flex-shrink:0; }
  .btn-row { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }

  /* Particles */
  .particle { position:absolute; border-radius:50%; pointer-events:none; animation:particle-burst .6s ease-out forwards; }
  .particle.star { animation-duration:.85s; }
  @keyframes particle-burst {
    0%   { transform:translate(0,0) scale(1); opacity:1; }
    100% { transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; }
  }
  .ripple {
    position:absolute; border-radius:50%; border:2px solid rgba(255,255,255,.6);
    animation:ripple-out .4s ease-out forwards; pointer-events:none;
  }
  @keyframes ripple-out { from{transform:scale(1);opacity:.7} to{transform:scale(2.5);opacity:0} }
</style>
</head>
<body>

<h1>Bubble Pop! 🫧</h1>
<p class="subtitle">泡をタップして生き延びろ！</p>

<div class="hud">
  <div class="stat-box primary">
    <div class="stat-label">スコア</div>
    <div class="stat-value" id="score-display">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">コンボ</div>
    <div class="stat-value" id="combo-display">×0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">残り時間</div>
    <div class="stat-value" id="time-display">15</div>
  </div>
</div>

<div id="game-area">
  <div id="water"></div>
  <div class="overlay" id="screen-start">
    <h2>Bubble Pop! 🫧</h2>
    <p>泡をタップして制限時間をゲット！<br>
       コンボで泡がどんどん速くなる！<br>
       ⭐ 星の泡はスコア2倍！</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-start">ゲームスタート</button>
    </div>
  </div>

  <div class="overlay" id="screen-gameover" style="display:none">
    <h2>ゲームオーバー！</h2>
    <div class="big-score" id="final-score">0</div>
    <div class="result-label">スコア</div>
    <div class="result-row">
      <span>生存 <strong id="final-survival">0.0s</strong></span>
      <span>最大コンボ <strong id="final-combo">0</strong></span>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-retry">もう一度</button>
      <button class="btn btn-x" id="btn-share">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        Xでシェア
      </button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  SOUND ENGINE (Web Audio API)
// ═══════════════════════════════════════════
const Sound = (() => {
  let ctx = null;

  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // Single oscillator with frequency sweep and gain envelope
  function playOsc(type, freq, freqEnd, t0, t1, vol) {
    const c = getCtx();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (freqEnd !== freq) o.frequency.exponentialRampToValueAtTime(freqEnd, t1);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t1);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t1 + 0.02);
  }

  // Noise burst (bandpass filtered)
  function playNoise(t0, dur, filterFreq, filterQ, vol) {
    const c = getCtx();
    const len = Math.ceil(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource();
    src.buffer = buf;
    const flt = c.createBiquadFilter();
    flt.type = 'bandpass'; flt.frequency.value = filterFreq; flt.Q.value = filterQ;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(flt); flt.connect(g); g.connect(c.destination);
    src.start(t0); src.stop(t0 + dur);
  }

  return {
    init() { getCtx(); },

    // Bubble pop: blop tone + noise burst, pitch scaled by size
    pop(size, isSpecial) {
      const c = getCtx(); const t = c.currentTime;
      const f = isSpecial ? 680 : Math.max(220, 580 - (size - 40) / 30 * 300);
      playOsc('sine', f * 1.7, f * 0.45, t, t + 0.12, 0.5);
      playNoise(t, 0.04, f * 1.3, 3, 0.35);
      if (isSpecial) {
        playOsc('sine',     f * 2.0, f * 1.4, t,        t + 0.25, 0.28);
        playOsc('sine',     f * 3.0, f * 2.0, t + 0.03, t + 0.30, 0.18);
        playOsc('triangle', f * 4.5, f * 2.5, t + 0.06, t + 0.35, 0.12);
        playNoise(t, 0.07, 3500, 2, 0.2);
      }
    },

    // Short rising tick on each combo (starts from combo 3)
    comboTick(combo) {
      if (combo < 3) return;
      const c = getCtx(); const t = c.currentTime;
      const f = Math.min(2200, 300 + combo * 55);
      playOsc('triangle', f, f * 1.12, t, t + 0.07, 0.15);
    },

    // Ascending arpeggio at combo milestones (5, 10, 15...)
    comboMilestone(combo) {
      const c = getCtx(); const t = c.currentTime;
      const scale = [262, 330, 392, 523, 659, 784];
      const n = Math.min(scale.length, Math.floor(combo / 5));
      for (let i = 0; i < n; i++)
        playOsc('triangle', scale[i], scale[i] * 1.01, t + i * 0.08, t + i * 0.08 + 0.14, 0.22);
    },

    // Descending tone when combo breaks
    comboBreak(prev) {
      if (prev < 3) return;
      const c = getCtx(); const t = c.currentTime;
      playOsc('sawtooth', 300, 120, t, t + 0.18, 0.2);
    },

    // Heartbeat tick when time is critical
    danger() {
      const c = getCtx(); const t = c.currentTime;
      playOsc('square', 170, 150, t, t + 0.055, 0.1);
    },

    // Descending 4-note game over
    gameOver() {
      const c = getCtx(); const t = c.currentTime;
      [392, 330, 262, 196].forEach((f, i) =>
        playOsc('sawtooth', f, f * 0.88, t + i * 0.2, t + i * 0.2 + 0.28, 0.28));
    },

    // Ascending 4-note start jingle
    start() {
      const c = getCtx(); const t = c.currentTime;
      [262, 330, 392, 523].forEach((f, i) =>
        playOsc('triangle', f, f * 1.02, t + i * 0.1, t + i * 0.1 + 0.16, 0.25));
    }
  };
})();

// ═══════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════
const MAX_TIME  = 15.0;  // fixed time cap (seconds internally)
const MAX_UNITS = 15;    // display unit (MAX_TIME = 15)
const SIZE_MIN = 40, SIZE_MAX = 70;
const SPECIAL_CHANCE = 0.12;
const BUBBLE_COLORS = [
  { bg:'rgba(168,85,247,1)',  glow:'#a855f7' },
  { bg:'rgba(99,102,241,1)',  glow:'#6366f1' },
  { bg:'rgba(6,182,212,1)',   glow:'#06b6d4' },
  { bg:'rgba(236,72,153,1)',  glow:'#ec4899' },
  { bg:'rgba(245,158,11,1)',  glow:'#f59e0b' },
  { bg:'rgba(16,185,129,1)',  glow:'#10b981' },
  { bg:'rgba(239,68,68,1)',   glow:'#ef4444' },
];

// ─── Helpers ──────────────────────────────
// Drain rate increases with elapsed time: 1x at start, grows proportionally
function drainRate() { return 1 + survivalTime * 0.03; }
// Convert internal seconds to display units (0-100)
function toUnits(sec) { return Math.round(sec / MAX_TIME * MAX_UNITS); }
function scoreForSize(size) { return Math.round((SIZE_MIN + SIZE_MAX - size) * 1.5); }
function timeGainForSize(size) {
  const t = Math.min(1, Math.max(0, (size - SIZE_MIN) / (SIZE_MAX - SIZE_MIN)));
  return parseFloat((1.0 - t * 0.5).toFixed(2)); // 小泡:1.0s ～ 大泡:0.5s
}
// Combo speeds up bubbles and spawn: multiplier < 1 = faster
function comboMult() { return Math.max(0.4, 1 - combo * 0.025); }

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let score = 0, combo = 0, maxCombo = 0;
let timeLeft = MAX_TIME, survivalTime = 0;
let gameRunning = false;
let spawnTimer = null, tickTimer = null;
let lastDangerHalf = -1;

// ─── DOM ──────────────────────────────────
const area         = document.getElementById('game-area');
const scoreEl      = document.getElementById('score-display');
const comboEl      = document.getElementById('combo-display');
const timeEl       = document.getElementById('time-display');
const waterEl      = document.getElementById('water');
const screenStart  = document.getElementById('screen-start');
const screenOver   = document.getElementById('screen-gameover');
const finalScoreEl = document.getElementById('final-score');
const finalSurvEl  = document.getElementById('final-survival');
const finalComboEl = document.getElementById('final-combo');

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-retry').addEventListener('click', startGame);
document.getElementById('btn-share').addEventListener('click', shareOnX);

// ═══════════════════════════════════════════
//  START
// ═══════════════════════════════════════════
function startGame() {
  Sound.init(); // unlock AudioContext on user gesture
  Sound.start();
  score = 0; combo = 0; maxCombo = 0;
  timeLeft = MAX_TIME; survivalTime = 0;
  lastDangerHalf = -1;
  gameRunning = true;

  updateHUD();
  waterEl.classList.remove('danger');
  screenStart.style.display = 'none';
  screenOver.style.display  = 'none';
  area.querySelectorAll('.bubble,.score-popup,.time-popup,.particle,.ripple,.combo-milestone').forEach(e=>e.remove());

  clearTimeout(spawnTimer); clearInterval(tickTimer);
  spawnBubble();
  scheduleNextBubble();

  tickTimer = setInterval(() => {
    timeLeft     = Math.max(0, timeLeft - drainRate() * 0.1);
    survivalTime += 0.1;
    updateHUD();

    // Danger heartbeat when < 30 units (≈2.1s)
    if (timeLeft < MAX_TIME * 0.3) {
      const half = Math.floor(survivalTime * 2);
      if (half !== lastDangerHalf) { lastDangerHalf = half; Sound.danger(); }
    }

    if (timeLeft <= 0) endGame();
  }, 100);
}

// ═══════════════════════════════════════════
//  SPAWN
// ═══════════════════════════════════════════
function scheduleNextBubble() {
  if (!gameRunning) return;
  spawnTimer = setTimeout(() => {
    if (!gameRunning) return;
    spawnBubble();
    scheduleNextBubble();
  }, getSpawnInterval());
}

function getSpawnInterval() {
  const base = Math.max(200, 900 - survivalTime * 15);
  return Math.round(base * comboMult());
}

function spawnBubble() {
  if (!gameRunning) return;
  const isSpecial = Math.random() < SPECIAL_CHANCE;
  const color = BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];
  const size  = isSpecial ? 52 + Math.random() * 16
                           : SIZE_MIN + Math.random() * (SIZE_MAX - SIZE_MIN);

  // Duration shortened by combo
  const baseDur  = Math.max(0.65, 2.5 * comboMult());
  const duration = baseDur + Math.random() * 0.4;

  const areaW = area.clientWidth;
  const x = size / 2 + Math.random() * (areaW - size);
  const y = area.clientHeight - size / 2;

  const b = document.createElement('div');
  b.className = 'bubble';
  b.style.cssText = `
    width:${size}px;height:${size}px;
    left:${x - size/2}px;top:${y - size/2}px;
    background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.15),${color.bg});
    box-shadow:0 0 ${isSpecial?32:18}px ${color.glow}, 0 0 6px rgba(0,0,0,.3), inset 0 0 6px rgba(255,255,255,.08);
    animation-duration:${duration}s;font-size:${size*.42}px;
  `;
  b.textContent = isSpecial ? '⭐' : '';
  b.dataset.glow    = color.glow;
  b.dataset.size    = size;
  b.dataset.special = isSpecial ? '1' : '0';

  b.addEventListener('pointerdown', onBubblePop, { passive: true });
  area.appendChild(b);

  // Bubble escaped → break combo
  b.addEventListener('animationend', () => {
    if (b.classList.contains('popped')) return;
    const prev = combo;
    combo = 0;
    updateHUD();
    Sound.comboBreak(prev);
    b.remove();
  });
}

// ═══════════════════════════════════════════
//  POP
// ═══════════════════════════════════════════
function freezeBubble(b) {
  // Lock the bubble at its current *visual* position so the pop animation
  // plays at the right place, not at the original bottom CSS position.
  const r  = b.getBoundingClientRect();
  const ar = area.getBoundingClientRect();
  b.style.animation = 'none';
  b.style.top       = (r.top  - ar.top)  + 'px';
  b.style.left      = (r.left - ar.left) + 'px';
  b.style.transform = 'none';
  void b.offsetHeight; // force reflow
}

function onBubblePop(e) {
  if (!gameRunning) return;
  const b = e.currentTarget;
  if (b.classList.contains('popped')) return;

  freezeBubble(b);
  b.classList.add('popped');

  const isSpecial = b.dataset.special === '1';
  const sz        = parseFloat(b.dataset.size);
  const glow      = b.dataset.glow;

  // ── Combo ──
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  Sound.pop(sz, isSpecial);
  Sound.comboTick(combo);
  if (combo % 5 === 0) {
    showComboMilestone(combo);
    Sound.comboMilestone(combo);
  }

  // ── Score ──
  const pts = scoreForSize(sz) * (isSpecial ? 2 : 1);
  score += pts;

  // ── Time gain (capped at MAX_TIME) ──
  const gain = timeGainForSize(sz);
  timeLeft = Math.min(MAX_TIME, timeLeft + gain);

  updateHUD();

  // ── Effects at tap position ──
  const ar = area.getBoundingClientRect();
  const px = e.clientX - ar.left;
  const py = e.clientY - ar.top;

  showScorePopup(px, py, '+' + pts, glow, isSpecial);
  showTimePopup(px, py + 34, '+' + gain.toFixed(1));
  spawnParticles(px, py, glow, isSpecial);

  const rip = document.createElement('div');
  rip.className = 'ripple';
  rip.style.cssText = `width:${sz}px;height:${sz}px;left:${px-sz/2}px;top:${py-sz/2}px;border-color:${glow}`;
  area.appendChild(rip);
  rip.addEventListener('animationend', () => rip.remove());

  b.addEventListener('animationend', () => b.remove(), { once: true });
}

// ═══════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════
function updateHUD() {
  scoreEl.textContent = score;
  comboEl.textContent = '×' + combo;
  timeEl.textContent  = toUnits(timeLeft);

  const pct = timeLeft / MAX_TIME * 100;
  waterEl.style.height = pct + '%';
  if (pct < 30) waterEl.classList.add('danger');
  else          waterEl.classList.remove('danger');
}

// ═══════════════════════════════════════════
//  EFFECT HELPERS
// ═══════════════════════════════════════════
function showScorePopup(x, y, text, color, isStar) {
  const el = document.createElement('div');
  el.className = 'score-popup ' + (isStar ? 'star' : 'normal');
  el.textContent = text;
  el.style.cssText = `left:${x}px;top:${y - 10}px;color:${color}`;
  area.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function showTimePopup(x, y, text) {
  const el = document.createElement('div');
  el.className = 'time-popup';
  el.textContent = text;
  el.style.cssText = `left:${x}px;top:${y}px`;
  area.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function showComboMilestone(n) {
  const el = document.createElement('div');
  el.className = 'combo-milestone';
  el.textContent = n >= 20 ? `🔥🔥🔥 COMBO ×${n}!` :
                   n >= 15 ? `🔥🔥 COMBO ×${n}!` :
                   n >= 10 ? `🔥 COMBO ×${n}!` :
                              `COMBO ×${n}!`;
  area.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function spawnParticles(x, y, color, isStar) {
  const count = isStar ? 16 : 8;
  const sz    = isStar ? '12px' : '8px';
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle' + (isStar ? ' star' : '');
    const angle = (i / count) * Math.PI * 2;
    const dist  = isStar ? 50 + Math.random() * 50 : 30 + Math.random() * 30;
    p.style.cssText = `left:${x}px;top:${y}px;width:${sz};height:${sz};
      background:${isStar && i % 2 === 0 ? '#ffd700' : color};
      --dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px`;
    area.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}

// ═══════════════════════════════════════════
//  END GAME
// ═══════════════════════════════════════════
function endGame() {
  if (!gameRunning) return;
  gameRunning = false;
  clearTimeout(spawnTimer); clearInterval(tickTimer);
  waterEl.style.height = '0%';
  waterEl.classList.remove('danger');
  Sound.gameOver();
  finalScoreEl.textContent = score;
  finalSurvEl.textContent  = survivalTime.toFixed(1) + 's';
  finalComboEl.textContent = maxCombo;
  screenOver.style.display = 'flex';
}

// ═══════════════════════════════════════════
//  SHARE
// ═══════════════════════════════════════════
function shareOnX() {
  const text = `🫧 Bubble Pop! スコア${score}点・最大コンボ×${maxCombo}・${survivalTime.toFixed(1)}秒生き残った！\nあなたも挑戦してみて👇`;
  window.open(`https://x.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(location.href)}`, '_blank', 'noopener');
}
</script>
